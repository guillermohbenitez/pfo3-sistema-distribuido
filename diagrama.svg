<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="690" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PFO 3 — Arquitectura distribuida del gestor de tareas</text>

  <!-- Clientes -->
  <text x="40" y="78" font-size="13" font-weight="700" fill="#64748b">CLIENTES</text>
  <g font-size="14" text-anchor="middle">
    <rect x="170" y="62" width="220" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="280" y="88" font-weight="700" fill="#0c4a6e">Cliente móvil</text>
    <text x="280" y="108" font-size="12" fill="#0c4a6e">App Android / iOS</text>

    <rect x="440" y="62" width="220" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="550" y="88" font-weight="700" fill="#0c4a6e">Cliente web</text>
    <text x="550" y="108" font-size="12" fill="#0c4a6e">Navegador</text>

    <rect x="710" y="62" width="220" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="820" y="88" font-weight="700" fill="#0c4a6e">Cliente Python</text>
    <text x="820" y="108" font-size="12" fill="#0c4a6e">cliente.py · socket TCP</text>
  </g>

  <!-- Clientes -> Balanceador -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="280" y1="124" x2="460" y2="180"/>
    <line x1="550" y1="124" x2="550" y2="180"/>
    <line x1="820" y1="124" x2="640" y2="180"/>
  </g>

  <!-- Balanceador -->
  <rect x="380" y="182" width="340" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Balanceador de carga</text>
  <text x="550" y="228" text-anchor="middle" font-size="12" fill="#78350f">Nginx / HAProxy · round-robin · health checks</text>

  <!-- Cluster de workers -->
  <rect x="40" y="282" width="760" height="304" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="58" y="575" font-size="12" font-weight="700" fill="#64748b">CLUSTER DE SERVIDORES WORKERS</text>

  <!-- Balanceador -> Workers -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="470" y1="244" x2="185" y2="320"/>
    <line x1="550" y1="244" x2="420" y2="320"/>
    <line x1="630" y1="244" x2="655" y2="320"/>
  </g>

  <!-- Workers -->
  <g id="workers" font-size="12" text-anchor="middle">
    <!-- Worker 1 -->
    <rect x="70" y="322" width="220" height="122" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="180" y="346" font-size="15" font-weight="700" fill="#14532d">Worker 1</text>
    <text x="180" y="364" fill="#14532d">servidor.py</text>
    <g fill="#bbf7d0" stroke="#16a34a">
      <rect x="92" y="378" width="38" height="28" rx="5"/><rect x="138" y="378" width="38" height="28" rx="5"/>
      <rect x="184" y="378" width="38" height="28" rx="5"/><rect x="230" y="378" width="38" height="28" rx="5"/>
    </g>
    <g fill="#14532d"><text x="111" y="397">H1</text><text x="157" y="397">H2</text><text x="203" y="397">H3</text><text x="249" y="397">H4</text></g>
    <text x="180" y="430" fill="#14532d" font-style="italic">pool de hilos</text>

    <!-- Worker 2 -->
    <rect x="310" y="322" width="220" height="122" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="420" y="346" font-size="15" font-weight="700" fill="#14532d">Worker 2</text>
    <text x="420" y="364" fill="#14532d">servidor.py</text>
    <g fill="#bbf7d0" stroke="#16a34a">
      <rect x="332" y="378" width="38" height="28" rx="5"/><rect x="378" y="378" width="38" height="28" rx="5"/>
      <rect x="424" y="378" width="38" height="28" rx="5"/><rect x="470" y="378" width="38" height="28" rx="5"/>
    </g>
    <g fill="#14532d"><text x="351" y="397">H1</text><text x="397" y="397">H2</text><text x="443" y="397">H3</text><text x="489" y="397">H4</text></g>
    <text x="420" y="430" fill="#14532d" font-style="italic">pool de hilos</text>

    <!-- Worker N -->
    <rect x="550" y="322" width="220" height="122" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="660" y="346" font-size="15" font-weight="700" fill="#14532d">Worker N</text>
    <text x="660" y="364" fill="#14532d">servidor.py</text>
    <g fill="#bbf7d0" stroke="#16a34a">
      <rect x="572" y="378" width="38" height="28" rx="5"/><rect x="618" y="378" width="38" height="28" rx="5"/>
      <rect x="664" y="378" width="38" height="28" rx="5"/><rect x="710" y="378" width="38" height="28" rx="5"/>
    </g>
    <g fill="#14532d"><text x="591" y="397">H1</text><text x="637" y="397">H2</text><text x="683" y="397">H3</text><text x="729" y="397">H4</text></g>
    <text x="660" y="430" fill="#14532d" font-style="italic">pool de hilos</text>
  </g>

  <!-- Workers <-> Cola -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-start="url(#flecha)" marker-end="url(#flecha)">
    <line x1="180" y1="447" x2="180" y2="489"/>
    <line x1="420" y1="447" x2="420" y2="489"/>
    <line x1="660" y1="447" x2="660" y2="489"/>
  </g>

  <!-- Cola de mensajes -->
  <rect x="70" y="492" width="700" height="62" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="420" y="516" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Cola de mensajes — RabbitMQ</text>
  <text x="420" y="538" text-anchor="middle" font-size="12" fill="#831843">cola de tareas pendientes · cola de resultados · comunicación entre servidores</text>

  <!-- Almacenamiento -->
  <text x="850" y="304" font-size="13" font-weight="700" fill="#64748b">ALMACENAMIENTO</text>
  <rect x="850" y="322" width="210" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="955" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">PostgreSQL</text>
  <text x="955" y="372" text-anchor="middle" font-size="12" fill="#4c1d95">usuarios, tareas, resultados</text>
  <text x="955" y="392" text-anchor="middle" font-size="12" fill="#4c1d95">primario + réplica</text>

  <rect x="850" y="462" width="210" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="955" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Amazon S3</text>
  <text x="955" y="512" text-anchor="middle" font-size="12" fill="#4c1d95">archivos adjuntos y</text>
  <text x="955" y="532" text-anchor="middle" font-size="12" fill="#4c1d95">resultados grandes</text>

  <!-- Cluster <-> Almacenamiento -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-start="url(#flecha)" marker-end="url(#flecha)">
    <line x1="803" y1="370" x2="847" y2="370"/>
    <line x1="803" y1="510" x2="847" y2="510"/>
  </g>

  <!-- Nota de implementación -->
  <rect x="40" y="606" width="1020" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="630" font-size="13" font-weight="700" fill="#334155">En el código de este repositorio</text>
  <text x="58" y="652" font-size="12.5" fill="#334155">Socket TCP con mensajes JSON · queue.Queue hace de RabbitMQ · un despachador reparte con round-robin (como el balanceador) · cada worker tiene su ThreadPoolExecutor</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
